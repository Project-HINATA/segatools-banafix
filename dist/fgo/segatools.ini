; -----------------------------------------------------------------------------
; Path settings
; -----------------------------------------------------------------------------

[vfs]
; Insert the path to the game AMFS directory here (contains ICF1 and ICF2)
amfs=
; Insert the path to the game Option directory here (contains Axxx directories)
option=
; Create an empty directory somewhere and insert the path here.
; This directory may be shared between multiple SEGA games.
; NOTE: This has nothing to do with Windows %APPDATA%.
appdata=

; -----------------------------------------------------------------------------
; Device settings
; -----------------------------------------------------------------------------

[aime]
; Enable Aime card reader assembly emulation. Disable to use a real SEGA Aime
; reader.
enable=1
aimePath=DEVICE\aime.txt

; Virtual-key code. If this button is **held** then the emulated IC card reader
; emulates an IC card in its proximity. A variety of different IC cards can be
; emulated; the exact choice of card that is emulated depends on the presence or
; absence of the configured card ID files. Default is the Return key.
scan=0x0D

[vfd]
; Enable VFD emulation. Disable to use a real VFD
; GP1232A02A FUTABA assembly.
enable=1

[deckReader]
; 837-15345 RFID deck reader emulation setting.
enable=1

[ftdi]
; FTDI serial to usb adapter emulation for CABINET LED.
enable=1
; COM port number where the LED board is connected to.
portNo=17

[led15093]
; 837-15093-06 LED board emulation setting.
enable=1
; COM port number for the LED board. Has to be the same as the FTDI port.
portNo1=17

; -----------------------------------------------------------------------------
; Network settings
; -----------------------------------------------------------------------------

[dns]
; Insert the hostname or IP address of the server you wish to use here.
; Note that 127.0.0.1, localhost etc are specifically rejected.
default=127.0.0.1

[netenv]
; Simulate an ideal LAN environment. This may interfere with head-to-head play.
; SEGA games are somewhat picky about their LAN environment, so leaving this
; setting enabled is recommended.
enable=1
; The final octet of the local host's IP address on the virtualized subnet (so,
; if the keychip subnet is `192.168.32.0` and this value is set to `11`, then the
; local host's virtualized LAN IP is `192.168.32.11`).
addrSuffix=11

; -----------------------------------------------------------------------------
; Board settings
; -----------------------------------------------------------------------------

[keychip]
; Keychip serial number. Keychip serials observed in the wild follow this
; pattern: `A\d{2}(E|X)-(01|20)[ABCDU]\d{8}`.
id=A69E-01A88888888

; The /24 LAN subnet that the emulated keychip will tell the game to expect.
; If you disable netenv then you must set this to your LAN's IP subnet, and
; that subnet must start with 192.168.
subnet=192.168.167.0

[pcbid]
; Set the Windows host name. This should be an ALLS MAIN ID, without the
; hyphen (which is not a valid character in a Windows host name).
serialNo=ACAE01A99999999

[system]
; Enable ALLS system settings.
enable=1

; Enable freeplay mode. This will disable the coin slot and set the game to
; freeplay. Keep in mind that some game modes (e.g. Freedom/Time Modes) will not
; allow you to start a game in freeplay mode.
freeplay=0

; -----------------------------------------------------------------------------
; Misc. hook settings
; -----------------------------------------------------------------------------

[gfx]
; Enables the graphics hook.
enable=1
; Force the game to run windowed.
windowed=0
; Add a frame to the game window if running windowed.
framed=0
; Enable DPI awareness for the game process, preventing Windows from stretching the game window if a DPI scaling higher than 100% is used
dpiAware=1

[touch]
; WinTouch emulation setting. (set to 0 for native touchscreens)
enable=1
; Enable coordinate remapping (set to 0 if windowed mode cursor offset occurs)
remap=1
cursor=1

[printer]
; Sinfonia CHC-C330 printer emulation setting.
enable=1
; Change the printer serial number here.
serial_no="5A-A123"
; Insert the path to the image output directory here.
printerOutPath="DEVICE\print"
; Rotate all printed images by 180 degrees.
rotate180=1

; -----------------------------------------------------------------------------
; Custom IO settings
; -----------------------------------------------------------------------------

[aimeio]
; To use a custom card reader IO DLL enter its path here.
; Leave empty if you want to use Segatools built-in keyboard input.
path=

[fgoio]
; To use a custom Fate/Grand Order Arcade IO DLL enter its path here.
; Leave empty if you want to use Segatools built-in gamepad input.
path=

; -----------------------------------------------------------------------------
; Input settings
; -----------------------------------------------------------------------------

; Keyboard bindings are specified as hexadecimal (prefixed with 0x) or decimal
; (not prefixed with 0x) virtual-key codes, a list of which can be found here:
;
; https://docs.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
;
; This is, admittedly, not the most user-friendly configuration method in the
; world. An improved solution will be provided later.

[io4]
; Test button virtual-key code. Default is the F1 key.
test=0x70
; Service button virtual-key code. Default is the F2 key.
service=0x71
; Keyboard button to increment coin counter. Default is the F3 key.
coin=0x72

;   .·:'''''''''''''''''''''''''''''''''''''''''''''':·.
;   : :  ______                            / \   []  : :
;   : : |      |   _____                   \ /  Coin : :
;   : : |______|  { (0) }      /--\      Attack.     : :
;   : :   DECK     \   /      /    \                 : :
;   : :             | |       >    <                 : :
;   : :             | |       \    /          ___    : :
;   : :             | |        \--/          |   |   : :
;   : :             JOY       Noble.         |   |   : :
;   : :                                      |___|   : :
;   : :                                      AIME.   : :
;   '·:..............................................:·'
;

; Select the input mode. "xinput" for controller, "keyboard" for keyboard.
mode=xinput

[xinput]
; XInput bindings
;
; Left Stick           Joystick
; Left Stick Click     Reset Camera
; Left Trigger         Dash
; Left Shoulder        Switch Target
; A/B                  Attack
; X/Y                  Noble Phantasm

; Configure deadzones for the left thumbsticks.
; The default value for the left stick is 7849, max value is 32767.
stickDeadzone=7849

[keyboard]
; Keyboard bindings:

; Keyboard movement
; Default is WASD keys for Joystick movemnt
up=0x57
down=0x53
left=0x41
right=0x44

; Dash button. Default is the Left Shift,
dash=0xA0
; Cycle Target button. Default is the F key.
target=0x46
; Attack button, Default is the Right Mouse Button.
attack=0x02
; Noble Phantasm button. Default is the Spacebar
np=0x20
; Center Camera, Default is the C key
camera=0x43
